services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: minicrm_backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - JWT_SECRET=super_secret_jwt_key_for_production
      - JWT_EXPIRES_IN=24h
      - JWT_REFRESH_SECRET=super_secret_refresh_key
      - JWT_REFRESH_EXPIRES_IN=7d
      - CORS_ORIGIN=http://localhost,http://localhost:80,http://localhost:5173
    volumes:
      - sqlite_data:/usr/src/app/prisma

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: minicrm_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  sqlite_data:
